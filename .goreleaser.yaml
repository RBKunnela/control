# Builds, packages and signs a release. Only .github/workflows/release.yml
# runs it for real, on a pushed tag; `make release-snapshot` builds the same
# archives locally and publishes nothing. RELEASING.md is the procedure.
version: 2

project_name: guardana-control

# Every binary is built under bin/: the demo archive keeps that directory, so a
# release user types the commands a checkout's tutorial shows, and the product
# archive strips it.
builds:
  - id: guardana-control
    main: ./cmd/guardana-control
    binary: bin/guardana-control
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    # The commit's time rather than the build's, so the same commit builds
    # byte-identical binaries on any machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: guardana-gateway
    main: ./cmd/guardana-gateway
    binary: bin/guardana-gateway
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The demo's two victim servers, deliberately vulnerable, which only the demo
  # archive carries.
  - id: vulnerable-mcp-agent
    main: ./examples/vulnerable-mcp-agent
    binary: bin/vulnerable-mcp-agent
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [guardana-control, guardana-gateway]
    formats: [tar.gz]
    name_template: "guardana-control_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    strip_binary_directory: true
    # A tar entry records its file's time, owner and mode; fixing them keeps
    # the archive itself reproducible, not only the binaries inside it. The
    # order of the two binaries follows the order they finished building,
    # which is why every run passes --parallelism=1.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: NOTICE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

  # Everything the tutorial needs without Go or a checkout, laid out as the
  # repository lays it out, in one directory named after the archive. The
  # product archive above never carries the victim. scripts/check-demo-archive.sh
  # runs the demo from this archive before a release is published.
  - id: demo
    ids: [guardana-control, guardana-gateway, vulnerable-mcp-agent]
    formats: [tar.gz]
    name_template: "guardana-control-demo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: NOTICE
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: examples/vulnerable-mcp-agent/README.md
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: examples/vulnerable-mcp-agent/demo.yaml
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: examples/vulnerable-mcp-agent/policy.json
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}
      - src: examples/vulnerable-mcp-agent/call.sh
        info: {owner: root, group: root, mode: 0755, mtime: "{{ .CommitDate }}"}
      - src: examples/vulnerable-mcp-agent/scenarios/*.json
        info: {owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}"}

# The gateway's image, built by ko from the build above without a Dockerfile.
# A release pushes it under a staging tag and the workflow signs, attests and
# verifies it by digest before it adds the version tag; a snapshot only loads
# it into the local Docker daemon.
kos:
  - id: guardana-gateway
    build: guardana-gateway
    # The base is named by the digest of its multi-platform index, read from
    # gcr.io/v2/distroless/static-debian12/manifests/nonroot. A tag the
    # upstream moves would change what ships without a change here.
    base_image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
    repositories: [ghcr.io/guardana/control-gateway]
    bare: true
    platforms: [linux/amd64, linux/arm64]
    # A staging tag nobody pulls as a version: release.yml adds the version
    # tag only after verification. No latest, since a tag that moves would
    # name a different image tomorrow, which the release policy refuses.
    tags: ["sha-{{ .FullCommit }}"]
    # The base's nonroot user, named here so a change of base cannot make the
    # gateway run as root.
    user: "65532:65532"
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    # ko would attach its SBOM under one more tag. The signature and the
    # provenance attestation already sit beside the image, as referrers or as
    # sha256-<digest> tags, depending on what the registry supports.
    sbom: none
    labels:
      org.opencontainers.image.source: https://github.com/guardana/control
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
    # The registry reads a multi-platform image's description from the index,
    # not from the configuration of each image under it.
    annotations:
      org.opencontainers.image.source: https://github.com/guardana/control
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    cmd: syft
    documents: ["{{ .ArtifactName }}.cdx.json"]
    # No --enrich: it reaches the network during the build, and what it adds
    # would differ between two builds of the same commit.
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Keyless: the certificate comes from the workflow's OIDC identity, so there is
# no key or password to keep. Only the checksum file is signed; it names the
# digest of every other asset.
signs:
  - id: checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

release:
  github:
    owner: guardana
    name: control
  # The workflow makes the draft before the build (scripts/draft-release.sh)
  # and publishes it only after the provenance is attested and the signature
  # and attestations verify; goreleaser uploads into that draft.
  draft: true
  use_existing_draft: true
  prerelease: auto
  mode: replace
  name_template: "Guardana Control {{ .Version }}"

# The notes come from CHANGELOG.md through scripts/release-notes.sh.
changelog:
  disable: true

snapshot:
  # A fixed 0.0.0 prerelease, so no snapshot sorts or reads as a real version.
  version_template: "0.0.0-snapshot.{{ .ShortCommit }}"
