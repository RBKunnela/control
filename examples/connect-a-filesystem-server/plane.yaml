# A plane between an MCP client and the MCP project's reference filesystem
# server, @modelcontextprotocol/server-filesystem 2026.8.31, whose tool
# definitions the fingerprints below were taken from. The plane runs on its
# own and starts the server; the client connects to the listener by URL. Paths
# resolve against this file's directory; the server's argument, the directory
# it may touch, is passed as written. docs/guides/connect-an-existing-mcp-setup.md
# is the page.
mode: ENFORCE
project_id: files
tenant_id: local
environment: dev

listener:
  kind: stateful_http           # 2025-11-25 and older; stdio when the client starts the plane
  address: 127.0.0.1:8080
  principal:
    id: me
  agent:
    id: my-client

policy:
  bundle_id: starter-approval-for-writes
  bundle_file: policy.bundle
  key_id: BUNDLE_KEY_ID_FROM_KEYGEN
  public_key: BUNDLE_PUBLIC_KEY_FROM_KEYGEN
  statement_file: policy.statement
  state_dir: floors
  freshness_key_id: FRESHNESS_KEY_ID_FROM_KEYGEN
  freshness_public_key: FRESHNESS_PUBLIC_KEY_FROM_KEYGEN
  poll_interval: 30s

approvals:
  authority: directory
  dir: approvals
  hold_journal_dir: holds

evidence:
  dir: spool
  fsync: every_record
  on_unwritable: block

export:
  endpoint: http://127.0.0.1:4318/v1/logs
  allow_plaintext: true
  headers:
    Authorization: Bearer COLLECTOR_CREDENTIAL_FROM_FILE

list:
  shaping: none

upstreams:
  - name: files
    command: node_modules/.bin/mcp-server-filesystem
    args:
      - /absolute/path/to/the/directory/to/share
    tenant_id: local
    environment: dev

overrides:
  - upstream: files
    tool: read_file
    fingerprint: sha256:bfb193c39b149e81ae956f28b3f12b99bb30e69ad5d5745f26950501b1dcd455
    effect: READ
    resource_type: file
    resource_from: /path
    trust_zone: TRUSTED_INTERNAL
