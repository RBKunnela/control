name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. A job that needs more says so at job level, with the
# step that needs it named in a comment.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main are not, because
  # every commit there has to have its own recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # -p keeps the step's bash from reading the startup files, options and
    # functions an earlier step can set through $GITHUB_ENV; -o pipefail fails
    # a step on a command that fails upstream of a pipe. The first word stays
    # bash, which actionlint needs to shellcheck each run block (ADR-0062).
    shell: bash --noprofile --norc -p -e -o pipefail {0}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in .git/config would
          # only widen what a later step, or anything it uploads, can reach.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the single source of the Go version. Never a literal.
          go-version-file: go.mod

      - name: Load pinned tool versions
        # A name allowlist, not a shape filter. On a pull request the checked
        # out tree is the fork's head, so this file is attacker-controlled and
        # whatever matches here lands in the environment of every later step.
        # Only names ending _VERSION or _SHA256 are admitted, with a value
        # charset that cannot hold a host, a path or a heredoc: GH_HOST, PATH
        # and GOSUMDB do not match, and neither does a comment line.
        #
        # BUF_SEMVER is derived because buf-action builds its download URL as
        # ".../download/v${version}" and would otherwise double the "v";
        # `grep .` turns a missing pin into a failure instead of a silent
        # fall-through to whatever version is current. The pins handed to an
        # action are required by name for the same reason: an action given an
        # empty version installs the current one, and an empty checksum checks
        # nothing, so a pin line in another shape fails here.
        run: |
          pins="$(grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env)"
          for name in GOLANGCI_LINT_VERSION BUF_SHA256 UV_VERSION UV_SHA256 CLIENT_PYTHON_FLOOR_VERSION CLIENT_PYTHON_VERSION; do
            grep -q "^${name}=" <<<"${pins}" || { echo "scripts/tool-versions.env has no ${name} line in the pinned shape" >&2; exit 1; }
          done
          printf '%s\n' "${pins}" >>"$GITHUB_ENV"
          sed -n 's/^BUF_VERSION=v*\([0-9][A-Za-z0-9._+-]*\)$/BUF_SEMVER=\1/p' \
            scripts/tool-versions.env | grep . >>"$GITHUB_ENV"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # `make lint` is the gate. This step only puts the binary on PATH, so
          # the linter runs once, with the arguments the Makefile chooses.
          install-only: true

      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ env.BUF_SEMVER }}
          # The action's own digest check on the binary it downloads.
          checksum: ${{ env.BUF_SHA256 }}
          # `make proto-check` drives buf. This step only installs it.
          setup_only: true

      - name: Install pinned release binaries
        # gitleaks, osv-scanner, actionlint and zizmor publish actions that run
        # a scan, not actions that install a binary. The Makefile calls the
        # binaries, so the binaries are what CI has to provide. The runner
        # image carries a shellcheck of its own, at whatever version the image
        # was built with; the pinned one below comes first on PATH.
        #
        # Each download is checked against the digest pinned beside its version.
        # A release asset can be replaced by its maintainer without the tag
        # moving, and eight SHA-pinned actions in this job would be worth little
        # standing next to six unverified downloads.
        #
        # uv installs the Python client's two interpreters from its own list of
        # builds, each with a digest that version of uv carries, so the pinned
        # uv is what pins them. No interpreter is put on PATH.
        run: |
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "${bin}" "${dl}"
          fetch() {
            curl -fsSL --retry 3 --retry-connrefused -o "${dl}/$1" "$2"
            printf '%s  %s\n' "$3" "${dl}/$1" | sha256sum -c -
          }
          fetch gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" "${GITLEAKS_SHA256}"
          fetch actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" "${ACTIONLINT_SHA256}"
          fetch zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" "${ZIZMOR_SHA256}"
          fetch osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" "${OSV_SCANNER_SHA256}"
          fetch shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" "${SHELLCHECK_SHA256}"
          fetch uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" "${UV_SHA256}"
          tar -xzf "${dl}/gitleaks.tar.gz" -C "${bin}" gitleaks
          tar -xzf "${dl}/actionlint.tar.gz" -C "${bin}" actionlint
          tar -xzf "${dl}/zizmor.tar.gz" -C "${bin}" zizmor
          tar -xJf "${dl}/shellcheck.tar.xz" -C "${bin}" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          tar -xzf "${dl}/uv.tar.gz" -C "${bin}" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          install -m 0755 "${dl}/osv-scanner" "${bin}/osv-scanner"
          echo "${bin}" >>"$GITHUB_PATH"
          "${bin}/uv" python install --no-config --no-bin "${CLIENT_PYTHON_FLOOR_VERSION}" "${CLIENT_PYTHON_VERSION}"

      - name: Run the quality gate
        # make takes options from these variables, so an earlier step that
        # set one could make it skip a check; GO names the go the gate runs.
        run: /usr/bin/env -u MAKEFLAGS -u GNUMAKEFLAGS -u MFLAGS -u MAKEFILES make quality GO=go

      - name: Check every action pin against its repository
        # The gate's own checks see only a pin's shape, and a commit from any
        # fork of an action is fetchable under its name. This asks GitHub for
        # the commit each version comment's tag names in that action's
        # repository, and fails on a mismatch or on an answer it cannot get.
        # The job's read-only token reads public repositories' tags.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/pin-actions.sh --check

  proto-breaking:
    name: Wire contract compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release tags are what the contract is compared against.
          fetch-depth: 0

      - name: Load pinned tool versions
        run: |
          pins="$(grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env)"
          grep -q '^BUF_SHA256=' <<<"${pins}" || { echo "scripts/tool-versions.env has no BUF_SHA256 line in the pinned shape" >&2; exit 1; }
          printf '%s\n' "${pins}" >>"$GITHUB_ENV"
          sed -n 's/^BUF_VERSION=v*\([0-9][A-Za-z0-9._+-]*\)$/BUF_SEMVER=\1/p' \
            scripts/tool-versions.env | grep . >>"$GITHUB_ENV"

      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: ${{ env.BUF_SEMVER }}
          checksum: ${{ env.BUF_SHA256 }}
          setup_only: true

      - name: Compare the wire contract against the latest release
        # No continue-on-error: a check that cannot fail is not a check. The
        # published contract is the latest release's, and on a push to main
        # main is the tree being checked, so the release tag is what to compare
        # to. The script refuses rather than passes when there is none.
        run: scripts/proto-breaking.sh

  mcp-client:
    name: External MCP client
    # The guide for an existing MCP setup, run end to end with the MCP
    # project's Python SDK against the reference filesystem server (ADR-0057).
    # No condition and no path filter: a required check must report on every
    # pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # This job runs third-party packages; it must not write the module
          # and build cache the quality job restores.
          cache: false

      - name: Load pinned tool versions
        # The same name allowlist as the quality job's, for the same reason.
        run: |
          pins="$(grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env)"
          for name in UV_VERSION UV_SHA256 CLIENT_PYTHON_VERSION NODE_VERSION NODE_SHA256; do
            grep -q "^${name}=" <<<"${pins}" || { echo "scripts/tool-versions.env has no ${name} line in the pinned shape" >&2; exit 1; }
          done
          printf '%s\n' "${pins}" >>"$GITHUB_ENV"

      - name: Install uv and Node.js
        # Each download is checked against the digest pinned beside its version.
        run: |
          bin="${RUNNER_TEMP}/bin"
          node="${RUNNER_TEMP}/node"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "${bin}" "${node}" "${dl}"
          fetch() {
            curl -fsSL --retry 3 --retry-connrefused -o "${dl}/$1" "$2"
            printf '%s  %s\n' "$3" "${dl}/$1" | sha256sum -c -
          }
          fetch uv.tar.gz "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" "${UV_SHA256}"
          fetch node.tar.xz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" "${NODE_SHA256}"
          tar -xzf "${dl}/uv.tar.gz" -C "${bin}" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          tar -xJf "${dl}/node.tar.xz" -C "${node}" --strip-components=1
          echo "${bin}" >>"$GITHUB_PATH"
          echo "${node}/bin" >>"$GITHUB_PATH"
          "${bin}/uv" python install --no-config --no-bin "${CLIENT_PYTHON_VERSION}"

      - name: Run the guide with an external MCP client
        run: env -u MAKEFLAGS -u GNUMAKEFLAGS -u MFLAGS make check-mcp-client GO=go
