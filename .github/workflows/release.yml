name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: builds the snapshot a tag would build and publishes nothing
  # but the Python client's snapshot, to the test index.
  workflow_dispatch:
    inputs:
      version:
        description: The tag the release would carry, such as v1.2.3-alpha; its CHANGELOG section must be dated and non-empty
        required: true
        type: string

# Read-only by default. A job that needs more says so at job level, with the
# step that needs it named in a comment.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release cancelled halfway leaves a draft with some of its assets, and a
  # dry run is cheap enough to finish. Nothing here is worth cancelling.
  cancel-in-progress: false

defaults:
  run:
    # GitHub's "bash" adds -o pipefail, which the bare default shell does not.
    shell: bash

jobs:
  snapshot:
    name: Snapshot build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # Check the gate: reads CI's and Security's runs of this commit
      security-events: read # Check the gate: reads the open code scanning alerts on main
      id-token: write # Attest the client's snapshot: signs the provenance
      attestations: write # Attest the client's snapshot: stores the provenance
    outputs:
      client-version: ${{ steps.client.outputs.version }}
      client-files: ${{ steps.client.outputs.files }}
    steps:
      - name: Check that the dry run is on a branch
        # The client's snapshot is attested under the ref the run is on; on a
        # tag it would carry the identity a release's own files carry.
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "a dry run runs on a branch, not on ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads the tags to name the version it builds.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the gate
        # The same check the tag's run makes, so a dry run that passes says
        # the release would get past it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-gate-runs.sh "${GITHUB_SHA}"

      - name: Check the release notes
        # The notes the tag's run would publish, shown in the run's summary.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          notes="${RUNNER_TEMP}/notes.md"
          scripts/release-notes.sh "${VERSION}" >"${notes}"
          cat "${notes}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from a clean module cache, so the dry run does too.
          cache: false

      - name: Load pinned tool versions
        # A name allowlist, not a shape filter. See ci.yml for the reasoning.
        run: |
          grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env >>"$GITHUB_ENV"

      - name: Install goreleaser and syft
        # Each download is checked against the digest pinned beside its
        # version, as in ci.yml.
        run: |
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "${bin}" "${dl}"
          fetch() {
            curl -fsSL --retry 3 --retry-connrefused -o "${dl}/$1" "$2"
            printf '%s  %s\n' "$3" "${dl}/$1" | sha256sum -c -
          }
          fetch goreleaser.tar.gz "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" "${GORELEASER_SHA256}"
          fetch syft.tar.gz "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" "${SYFT_SHA256}"
          tar -xzf "${dl}/goreleaser.tar.gz" -C "${bin}" goreleaser
          tar -xzf "${dl}/syft.tar.gz" -C "${bin}" syft
          echo "${bin}" >>"$GITHUB_PATH"

      - name: Install uv and the client's interpreters
        # As in ci.yml: uv from the digest pinned beside its version, and the
        # Python client's two interpreters from uv's own list of builds, each
        # checked against a digest that version of uv carries.
        run: |
          bin="${RUNNER_TEMP}/uv"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 --retry-connrefused -o "${RUNNER_TEMP}/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${UV_SHA256}" "${RUNNER_TEMP}/uv.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/uv.tar.gz" -C "${bin}" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "${bin}" >>"$GITHUB_PATH"
          "${bin}/uv" python install --no-config --no-bin "${CLIENT_PYTHON_FLOOR_VERSION}" "${CLIENT_PYTHON_VERSION}"

      - name: Build the client's snapshot
        id: client
        # The version the tag would give the client, which the release commit
        # set in its project file, as a development release numbered by this
        # run: the test index keeps every file it was ever given.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python="$(UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never uv python find --no-config "${CLIENT_PYTHON_VERSION}")"
          base="$("${python}" -I -B clients/python/check_wheel.py spell "${VERSION}")"
          have="$(grep -E '^version = ' clients/python/pyproject.toml)"
          if [[ "${have}" != "version = \"${base}\"" ]]; then
            echo "the client's project file says ${have}, not ${base}; the release commit sets it" >&2
            exit 1
          fi
          # The attempt in two digits, so that no run and attempt spell another's.
          version="${base}.dev${GITHUB_RUN_ID}$(printf '%02d' "${GITHUB_RUN_ATTEMPT}")"
          scripts/build-python-dist.sh "${RUNNER_TEMP}/python" "${version}"
          files="$(scripts/publish-python-dist.sh --list "${RUNNER_TEMP}/python")"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "files=${files}" >>"${GITHUB_OUTPUT}"

      - name: Attest the client's snapshot
        # So that the upload job verifies its files as the release's does.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/python/*

      - name: Keep the client's snapshot
        # A run attempted again builds its own files under its own version.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python
          path: ${{ runner.temp }}/python/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Build the snapshot
        # --parallelism=1 keeps the order of the binaries in each archive, and
        # so the archive's digest, the same from run to run. A snapshot loads
        # the gateway's image into the runner's Docker daemon, built for the
        # daemon's platform only, and pushes nothing.
        run: goreleaser release --snapshot --clean --skip=sign --parallelism=1

      - name: Scan the archives' binaries
        # The same scan the tag's run makes before anything is attested: every
        # Go binary of every archive against the Go vulnerability database.
        run: scripts/scan-binaries.sh archives dist

      - name: Run the demo from its archive
        # The runner's demo archive, extracted outside the checkout and run
        # with no Go on PATH: every scenario has to pass on the archive's own
        # binaries and files.
        run: scripts/check-demo-archive.sh dist

      - name: Run the snapshot image
        # With no arguments the gateway prints its version and exits, so this
        # runs the binary the image holds, as the user the image names.
        run: |
          version="$(jq -r .version dist/metadata.json)"
          image="goreleaser.ko.local:sha-$(jq -r .commit dist/metadata.json)"
          out="$(docker run --rm "${image}")"
          printf '%s\n' "${out}"
          if [[ "${out}" != "guardana-gateway ${version} "* ]]; then
            echo "the image did not print version ${version}" >&2
            exit 1
          fi
          user="$(docker image inspect "${image}" --format '{{.Config.User}}')"
          if [[ "${user}" != "65532:65532" ]]; then
            echo "the image runs as ${user:-root}, not as the base's nonroot user" >&2
            exit 1
          fi

      - name: Scan the snapshot image's binary
        # The snapshot loads one platform's image, whichever ko builds first,
        # so the platform is read from the image. The binary is copied out of
        # a container that never starts.
        run: |
          image="goreleaser.ko.local:sha-$(jq -r .commit dist/metadata.json)"
          platform="$(docker image inspect "${image}" --format '{{.Os}}/{{.Architecture}}')"
          scripts/scan-binaries.sh image "${image}" "${platform}"

      - name: Keep the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build, sign and publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The environment admits only tags matching v* and waits for a
    # maintainer's approval. The token's scopes come from this file at the
    # tagged commit, so the gate is the tag itself: only the admin and the
    # maintain role can create one.
    environment: release
    permissions:
      contents: write # Build and draft: goreleaser creates the draft and uploads its assets; Publish: gh releases it
      id-token: write # Build and draft, Sign the image: cosign signs keyless; Attest: signs the provenance
      attestations: write # Attest: stores the provenance attestations
      packages: write # Build and draft: ko pushes the image; Sign the image and Attest the image: push the signature and the provenance beside it
      artifact-metadata: write # Attest the image: records which registry holds the image, the organization's linked artifacts
      actions: read # Check the gate: reads CI's and Security's runs of the tagged commit
      security-events: read # Check the gate: reads the open code scanning alerts on main
    outputs:
      client-version: ${{ steps.client.outputs.version }}
      client-files: ${{ steps.client.outputs.files }}
    env:
      # The repository .goreleaser.yaml's kos section pushes to.
      IMAGE: ghcr.io/guardana/control-gateway
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads the tags to find the previous release.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        # A release is a tag on a commit of main. This refuses a tag put on
        # another branch by mistake; the provenance names the commit either way.
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "the tagged commit ${GITHUB_SHA} is not on main" >&2
            exit 1
          fi

      - name: Check the gate
        # A tag on a commit whose CI or Security run failed, or never ran,
        # would publish what nobody verified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-gate-runs.sh "${GITHUB_SHA}"

      - name: Check that the tag names an image tag
        # The version becomes the image's tag, whose grammar is narrower than
        # a git tag's: semver build metadata such as +build would pass the
        # build and the signing and fail only when the tag is written.
        run: |
          if [[ ! "${GITHUB_REF_NAME#v}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "the tag ${GITHUB_REF_NAME} gives ${GITHUB_REF_NAME#v}, which is not a valid image tag" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A restored cache is written by other runs; what ships is built
          # from modules fetched and checked against go.sum in this one.
          cache: false

      - name: Load pinned tool versions
        # A name allowlist, not a shape filter. See ci.yml for the reasoning.
        run: |
          grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env >>"$GITHUB_ENV"

      - name: Install goreleaser, cosign and syft
        run: |
          bin="${RUNNER_TEMP}/bin"
          dl="${RUNNER_TEMP}/dl"
          mkdir -p "${bin}" "${dl}"
          fetch() {
            curl -fsSL --retry 3 --retry-connrefused -o "${dl}/$1" "$2"
            printf '%s  %s\n' "$3" "${dl}/$1" | sha256sum -c -
          }
          fetch goreleaser.tar.gz "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" "${GORELEASER_SHA256}"
          fetch cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" "${COSIGN_SHA256}"
          fetch syft.tar.gz "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" "${SYFT_SHA256}"
          tar -xzf "${dl}/goreleaser.tar.gz" -C "${bin}" goreleaser
          tar -xzf "${dl}/syft.tar.gz" -C "${bin}" syft
          install -m 0755 "${dl}/cosign" "${bin}/cosign"
          echo "${bin}" >>"$GITHUB_PATH"

      - name: Install uv and the client's interpreters
        # As in ci.yml: uv from the digest pinned beside its version, and the
        # Python client's two interpreters from uv's own list of builds, each
        # checked against a digest that version of uv carries.
        run: |
          bin="${RUNNER_TEMP}/uv"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 --retry-connrefused -o "${RUNNER_TEMP}/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${UV_SHA256}" "${RUNNER_TEMP}/uv.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/uv.tar.gz" -C "${bin}" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "${bin}" >>"$GITHUB_PATH"
          "${bin}/uv" python install --no-config --no-bin "${CLIENT_PYTHON_FLOOR_VERSION}" "${CLIENT_PYTHON_VERSION}"

      - name: Log in to the container registry
        # With the job's own token, scoped by packages: write above. ko, cosign,
        # the attest action and gh read the credential docker stores.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Extract the release notes
        # Fails when CHANGELOG.md has no dated, non-empty section for the tag,
        # before anything is built or drafted. Publish appends the image line
        # to these notes, so notes that already name the image, or hold a
        # comment that could hide text, are refused here.
        run: |
          notes="${RUNNER_TEMP}/notes.md"
          scripts/release-notes.sh "${GITHUB_REF_NAME}" >"${notes}"
          if grep -qF "${IMAGE}@" "${notes}"; then
            echo "the notes for ${GITHUB_REF_NAME} already name ${IMAGE}@; only Publish writes that line" >&2
            exit 1
          fi
          if grep -qF '<!--' "${notes}"; then
            echo "the notes for ${GITHUB_REF_NAME} hold an HTML comment (<!--), which could hide text" >&2
            exit 1
          fi

      - name: Build the client's release files
        id: client
        # Before anything is pushed or drafted, as the dry run builds its
        # snapshot: the tag's version, which the release commit set in the
        # project file. The script checks that the files carry the newest
        # dated section's version, so the tag, the project and the notes agree.
        run: |
          python="$(UV_MANAGED_PYTHON=1 UV_PYTHON_DOWNLOADS=never uv python find --no-config "${CLIENT_PYTHON_VERSION}")"
          version="$("${python}" -I -B clients/python/check_wheel.py spell "${GITHUB_REF_NAME}")"
          have="$(grep -E '^version = ' clients/python/pyproject.toml)"
          if [[ "${have}" != "version = \"${version}\"" ]]; then
            echo "the client's project file says ${have}, not ${version}; the release commit sets it" >&2
            exit 1
          fi
          scripts/build-python-dist.sh "${RUNNER_TEMP}/python"
          files="$(scripts/publish-python-dist.sh --list "${RUNNER_TEMP}/python")"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "files=${files}" >>"${GITHUB_OUTPUT}"

      - name: Attest the client's release files
        # Straight after the build, before any other tool of this job runs and
        # could rewrite them: the upload job takes what this attests.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/python/*

      - name: Keep the client's release files
        # For the upload job, which runs only once the release is published
        # and can be run again alone.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python
          path: ${{ runner.temp }}/python/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Build and draft
        # ko pushes the gateway's image before the draft exists, under a
        # staging tag named after the commit; the version tag is added only
        # once the image is verified. The current tag is named because a
        # commit can carry a pre-release and a final tag at once.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        run: goreleaser release --clean --parallelism=1 --release-notes "${RUNNER_TEMP}/notes.md"

      - name: Scan the archives' binaries
        # Before anything is attested or published: a known vulnerability in
        # any binary a user downloads leaves the draft unpublished.
        run: scripts/scan-binaries.sh archives dist

      - name: Read the image's digest
        id: image
        # goreleaser records the digest of the index ko pushed, under the
        # repository's name with neither tag nor digest. The image is signed,
        # attested, verified and tagged by that digest.
        run: |
          digests="$(jq -r --arg name "${IMAGE}" \
            '.[] | select(.type == "Docker Manifest" and .name == $name) | .extra.Digest' dist/artifacts.json)"
          if [[ ! "${digests}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "want one digest for ${IMAGE} in dist/artifacts.json, found: ${digests:-none}" >&2
            exit 1
          fi
          echo "digest=${digests}" >>"$GITHUB_OUTPUT"

      - name: Scan the image's binaries
        # Before anything is attested or signed: the binary of each platform,
        # pulled by the digest that is signed, attested and tagged below, and
        # never run. The script refuses unless the pushed index holds exactly
        # these platforms, so one added to .goreleaser.yaml's kos.platforms
        # fails here until it is named too.
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/scan-binaries.sh image "${IMAGE}@${DIGEST}" linux/amd64 linux/arm64

      - name: Run the demo from its archive
        # Before anything is attested or published: a demo archive that lacks
        # a file or fails a scenario leaves the draft unpublished.
        run: scripts/check-demo-archive.sh dist

      - name: Attest the assets
        # checksums.txt names every archive and every bill of materials, so one
        # attestation per line covers each of them.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest the checksum file
        # The action takes one kind of subject per step, and the checksum file
        # is not listed in itself.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Sign the image
        # Keyless, as the checksum file is: the certificate names this workflow
        # and the tag. The signature is pushed beside the image.
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Verify before publishing
        # The same checks RELEASING.md gives a user. A failure here leaves the
        # draft unpublished, and nobody downloads a draft.
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # The exact identity: gh's --signer-workflow is a prefix pattern.
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          (cd dist && sha256sum --strict -c checksums.txt)
          cosign verify-blob dist/checksums.txt \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          archives=0
          sboms=0
          for f in dist/*.tar.gz dist/*.cdx.json dist/checksums.txt; do
            [[ -f "${f}" ]] || { echo "no file matches ${f}" >&2; exit 1; }
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${identity}" \
              --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
            case "${f}" in
              *.tar.gz)
                [[ -f "${f}.cdx.json" ]] || { echo "no SBOM for ${f}: ${f}.cdx.json is missing" >&2; exit 1; }
                archives=$((archives + 1))
                ;;
              *.cdx.json)
                [[ -f "${f%.cdx.json}" ]] || { echo "${f} describes no archive" >&2; exit 1; }
                sboms=$((sboms + 1))
                ;;
            esac
          done
          # The product and the demo archive, for two systems times two
          # architectures in .goreleaser.yaml, each with its own SBOM. A missing
          # platform, or a glob that matched nothing, is not a verified release.
          if [[ "${archives}" -ne 8 || "${sboms}" -ne 8 ]]; then
            echo "expected 8 archives and 8 SBOMs, verified ${archives} archives and ${sboms} SBOMs" >&2
            exit 1
          fi
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${identity}" \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${identity}" \
            --source-ref "${GITHUB_REF}" --deny-self-hosted-runners

      - name: Tag the verified image
        # The registry is handed the index's own bytes, checked against the
        # verified digest, so the version tag cannot name anything else. A
        # client that rebuilds the index could change its digest.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          version="${GITHUB_REF_NAME#v}"
          token="$(curl -fsS -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull,push" | jq -r '.token // empty')"
          if [[ -z "${token}" ]]; then
            echo "the registry gave no token for ${repo}" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          dir="$(mktemp -d)"
          curl -fsS -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            -D "${dir}/headers" -o "${dir}/index" "https://ghcr.io/v2/${repo}/manifests/${DIGEST}"
          type="$(tr -d '\r' <"${dir}/headers" | awk 'tolower($1) == "content-type:" { t = $2 } END { print t }')"
          case "${type}" in
            application/vnd.oci.image.index.v1+json | application/vnd.docker.distribution.manifest.list.v2+json) ;;
            *)
              echo "${IMAGE}@${DIGEST} is ${type:-of no type}, not an index" >&2
              exit 1
              ;;
          esac
          got="sha256:$(sha256sum "${dir}/index" | cut -d' ' -f1)"
          if [[ "${got}" != "${DIGEST}" ]]; then
            echo "the registry answered ${got} for ${DIGEST}" >&2
            exit 1
          fi
          curl -fsS -X PUT -H "Authorization: Bearer ${token}" -H "Content-Type: ${type}" \
            --data-binary "@${dir}/index" "https://ghcr.io/v2/${repo}/manifests/${version}" >/dev/null
          # A user pulls by tag, so the tag has to name what was verified.
          tagged="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')"
          if [[ "${tagged}" != "${DIGEST}" ]]; then
            echo "${IMAGE}:${version} names ${tagged:-nothing}, not the verified ${DIGEST}" >&2
            exit 1
          fi

      - name: Publish
        # What was verified above is dist/. A draft can be edited by anyone
        # with write access, so the draft is published only when it is the one
        # draft for this tag and holds exactly those files, digest for digest;
        # it is then published by its id, never looked up by the tag again.
        # The notes gain a last line naming the image's digest: that is where
        # users find it. A repository writer can still edit a published
        # release's notes, so the digest is trusted only once cosign verifies
        # it, as RELEASING.md says.
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate)"
          ids="$(jq -r -s --arg tag "${GITHUB_REF_NAME}" \
            '[.[][] | select(.draft and .tag_name == $tag) | .id] | .[]' <<<"${releases}")"
          if [[ "$(grep -c . <<<"${ids}")" -ne 1 ]]; then
            echo "want exactly one draft for ${GITHUB_REF_NAME}, found: ${ids:-none}" >&2
            exit 1
          fi
          id="${ids}"
          expected="$(cd dist && for f in *.tar.gz *.cdx.json checksums.txt checksums.txt.sigstore.json; do
            [[ -f "${f}" ]] || { echo "no file matches ${f}" >&2; exit 1; }
            printf '%s sha256:%s\n' "${f}" "$(sha256sum "${f}" | cut -d' ' -f1)"
          done | sort)"
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" --paginate \
            --jq '.[] | "\(.name) \(.digest)"' | sort)"
          if [[ "${expected}" != "${published}" ]]; then
            echo "the draft does not hold exactly the verified files" >&2
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${published}") >&2 || true
            exit 1
          fi
          line="Image: \`${IMAGE}@${DIGEST}\`"
          printf '\n%s\n' "${line}" >>"${RUNNER_TEMP}/notes.md"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
            -F draft=false -F "body=@${RUNNER_TEMP}/notes.md" >/dev/null
          # A write could land between the comparison and the publication. The
          # published release is immutable, so reading it once more settles it.
          after="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" --paginate \
            --jq '.[] | "\(.name) \(.digest)"' | sort)"
          if [[ "${expected}" != "${after}" ]]; then
            echo "RELEASE ${GITHUB_REF_NAME} WAS PUBLISHED WITH FILES OTHER THAN THE VERIFIED ONES; withdraw it and release the next version" >&2
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${after}") >&2 || true
            exit 1
          fi
          last="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq .body |
            tr -d '\r' | awk 'NF { line = $0 } END { print line }')"
          if [[ "${last}" != "${line}" ]]; then
            echo "RELEASE ${GITHUB_REF_NAME} WAS PUBLISHED WITHOUT ITS IMAGE LINE LAST IN THE NOTES; fix the notes by hand" >&2
            echo "want: ${line}" >&2
            echo "got:  ${last}" >&2
            exit 1
          fi
          echo "published release ${id} for ${GITHUB_REF_NAME}"

  test-index:
    name: Upload the client's snapshot to the test index
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The test index's publisher names this workflow and the testpypi
    # environment, which admits main alone: no other job, the snapshot's
    # among them, can mint a token it takes.
    environment: testpypi
    permissions:
      contents: read
      attestations: read # Verify the files: reads their provenance
      id-token: write # Upload: the index takes this job's identity in place of a token
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        # A name allowlist, not a shape filter. See ci.yml for the reasoning.
        run: |
          grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env >>"$GITHUB_ENV"

      - name: Install uv
        run: |
          bin="${RUNNER_TEMP}/uv"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 --retry-connrefused -o "${RUNNER_TEMP}/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${UV_SHA256}" "${RUNNER_TEMP}/uv.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/uv.tar.gz" -C "${bin}" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "${bin}" >>"$GITHUB_PATH"

      - name: Fetch the client's files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python
          path: ${{ runner.temp }}/python

      - name: Verify the files
        # An artifact can be written by any job of this run, so what is
        # uploaded is what the snapshot job built and attested.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for f in "${RUNNER_TEMP}"/python/*; do
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${identity}" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done

      - name: Upload
        # The version and the digests come from the step that built the files,
        # which no later tool of that job could change: an attestation that
        # job's identity made afterwards would vouch for a substitute too.
        env:
          VERSION: ${{ needs.snapshot.outputs.client-version }}
          FILES: ${{ needs.snapshot.outputs.client-files }}
        run: scripts/publish-python-dist.sh "${RUNNER_TEMP}/python" testpypi "${VERSION}" "${FILES}"

  index:
    name: Upload the client to the package index
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The package index's publisher names this workflow and the pypi
    # environment, which admits v* tags and waits for a maintainer again;
    # nothing the release job runs can mint a token the index takes. It runs
    # once the release is published; failed, it can be run again alone.
    environment: pypi
    permissions:
      contents: read
      attestations: read # Verify the files: reads their provenance
      id-token: write # Upload: the index takes this job's identity in place of a token
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned tool versions
        # A name allowlist, not a shape filter. See ci.yml for the reasoning.
        run: |
          grep -E '^[A-Z][A-Z0-9_]*_VERSION=v?[0-9][A-Za-z0-9._+-]*$|^[A-Z][A-Z0-9_]*_SHA256=[0-9a-f]{64}$' \
            scripts/tool-versions.env >>"$GITHUB_ENV"

      - name: Install uv
        run: |
          bin="${RUNNER_TEMP}/uv"
          mkdir -p "${bin}"
          curl -fsSL --retry 3 --retry-connrefused -o "${RUNNER_TEMP}/uv.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${UV_SHA256}" "${RUNNER_TEMP}/uv.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/uv.tar.gz" -C "${bin}" --strip-components=1 uv-x86_64-unknown-linux-gnu/uv
          echo "${bin}" >>"$GITHUB_PATH"

      - name: Fetch the client's files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python
          path: ${{ runner.temp }}/python

      - name: Verify the files
        # An artifact can be written by any job of this run, so what is
        # uploaded is what the release job built, attested and verified.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for f in "${RUNNER_TEMP}"/python/*; do
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}" \
              --cert-identity "${identity}" \
              --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done

      - name: Upload
        # The version and the digests come from the step that built the files,
        # which no later tool of that job could change: an attestation that
        # job's identity made afterwards would vouch for a substitute too.
        env:
          VERSION: ${{ needs.release.outputs.client-version }}
          FILES: ${{ needs.release.outputs.client-files }}
        run: scripts/publish-python-dist.sh "${RUNNER_TEMP}/python" pypi "${VERSION}" "${FILES}"
