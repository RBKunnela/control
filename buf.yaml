version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  # A `buf:lint:ignore` comment in a proto file would otherwise switch a rule
  # off for that element without a change here.
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  # The observation, finding and enforcement packages are unstable (ADR-0040,
  # ADR-0045, ADR-0051); every other package is still compared.
  # scripts/proto-breaking-probe.sh proves both.
  ignore:
    - api/proto/guardana/control/observe/v1alpha1
    - api/proto/guardana/control/finding/v1alpha1
    - api/proto/guardana/control/enforce/v1alpha1
