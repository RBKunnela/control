# One gateway that observes one MCP server. Every path is relative to this
# file, and every bound not named here stands at the default `doctor` prints.
mode: OBSERVE
project_id: orders
tenant_id: acme
environment: dev

listener:
  kind: stateless_http
  address: 127.0.0.1:8080
  origins:
    - http://localhost:5173
  principal:
    id: agent-runner
  agent:
    id: orders-assistant
    framework: example

policy:
  bundle_id: gateway-fixture
  bundle_file: policy.bundle
  key_id: k1
  public_key: 6kpsY+KcUgq+9VB7Ey7F+ZVHdq6+vnuSQh7qaRRG0iw=
  statement_file: policy.statement
  state_dir: floors
  freshness_key_id: f1
  freshness_public_key: 1UIH2hlJd9z0atv+wrwudbUtWopCGE/t/cAAJPDj6No=
  poll_interval: 5s

approvals:
  authority: memory

evidence:
  dir: spool

export:
  endpoint: https://127.0.0.1:4318/v1/logs

upstreams:
  - name: orders
    endpoint: http://127.0.0.1:1/mcp
